<svg width="640" height="300" viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="sweepFade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00D2FF" stop-opacity="0"/>
      <stop offset="85%" stop-color="#00D2FF" stop-opacity="0"/>
      <stop offset="100%" stop-color="#00D2FF" stop-opacity="0.9"/>
    </linearGradient>
    <clipPath id="scopeClip">
      <rect x="40" y="40" width="560" height="180"/>
    </clipPath>
  </defs>

  <rect x="20" y="20" width="600" height="240" rx="8" fill="#0B1118" stroke="#1B2733" stroke-width="1.2"/>
  <text x="40" y="46" font-family="Consolas, 'JetBrains Mono', monospace" font-size="11" letter-spacing="3" fill="#8B949E">LIVE RESPONSE</text>
  <text x="580" y="46" text-anchor="end" font-family="Consolas, 'JetBrains Mono', monospace" font-size="11" fill="#00D2FF">Kp 1.20  Ki 0.45  Kd 0.08</text>

  <g clip-path="url(#scopeClip)">
    <!-- graticule -->
    <g stroke="#16202B" stroke-width="1">
      <line x1="40" y1="70" x2="600" y2="70"/>
      <line x1="40" y1="110" x2="600" y2="110"/>
      <line x1="40" y1="150" x2="600" y2="150"/>
      <line x1="40" y1="190" x2="600" y2="190"/>
      <line x1="120" y1="55" x2="120" y2="215"/>
      <line x1="220" y1="55" x2="220" y2="215"/>
      <line x1="320" y1="55" x2="320" y2="215"/>
      <line x1="420" y1="55" x2="420" y2="215"/>
      <line x1="520" y1="55" x2="520" y2="215"/>
    </g>

    <!-- setpoint -->
    <line x1="40" y1="110" x2="600" y2="110" stroke="#2563EB" stroke-width="1.2" stroke-dasharray="4 4"/>
    <text x="46" y="105" font-family="Consolas, 'JetBrains Mono', monospace" font-size="9" fill="#2563EB">SETPOINT</text>

    <!-- step response curve, redrawn on loop -->
    <path d="M40,190 L100,190 C140,190 150,55 190,70 C215,79 225,120 245,110 C260,103 270,95 290,110 C300,117 310,113 320,110 L600,110"
      fill="none" stroke="#00D2FF" stroke-width="2" filter="url(#glow)"
      stroke-dasharray="900" stroke-dashoffset="900">
      <animate attributeName="stroke-dashoffset" values="900;0;0" keyTimes="0;0.65;1" dur="4.5s" repeatCount="indefinite"/>
    </path>
  </g>

  <rect x="40" y="40" width="560" height="180" fill="none" stroke="#1B2733" stroke-width="1"/>

  <g font-family="Consolas, 'JetBrains Mono', monospace" font-size="10" fill="#8B949E">
    <text x="40" y="230">t = 0</text>
    <text x="560" y="230">settling</text>
  </g>

  <circle cx="560" cy="46" r="3.5" fill="#00D2FF">
    <animate attributeName="opacity" values="1;0.25;1" dur="1.6s" repeatCount="indefinite"/>
  </circle>
</svg>
