<svg width="420" height="300" viewBox="0 0 420 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="corner" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#00D2FF"/>
    </marker>
  </defs>

  <rect x="15" y="15" width="390" height="270" rx="8" fill="#0B1118" stroke="#1B2733" stroke-width="1.2"/>
  <circle cx="20" cy="20" r="26" fill="#00D2FF" filter="url(#corner)">
    <animate attributeName="opacity" values="0.15;0.4;0.15" dur="3s" repeatCount="indefinite"/>
  </circle>

  <circle cx="36" cy="44" r="4" fill="#00D2FF">
    <animate attributeName="opacity" values="1;0.25;1" dur="1.6s" repeatCount="indefinite"/>
  </circle>
  <text x="48" y="48" font-family="Consolas, 'JetBrains Mono', monospace" font-size="11" letter-spacing="2" fill="#00D2FF">IN DEVELOPMENT</text>

  <text x="35" y="82" font-family="Consolas, 'JetBrains Mono', monospace" font-size="17" font-weight="700" fill="#F5F7FA">PID CONTROL INTERFACE</text>
  <text x="35" y="100" font-family="Consolas, 'JetBrains Mono', monospace" font-size="11" fill="#8B949E">LabWindows/CVI + MATLAB</text>

  <line x1="35" y1="155" x2="365" y2="155" stroke="#1B2733" stroke-width="1"/>
  <path d="M320,170 L320,205 L80,205 L80,170" fill="none" stroke="#1B2733" stroke-width="1" marker-end="url(#arrow)"/>
  <text x="200" y="220" text-anchor="middle" font-family="Consolas, 'JetBrains Mono', monospace" font-size="10" letter-spacing="2" fill="#8B949E">FEEDBACK</text>

  <rect x="35" y="140" width="90" height="30" rx="4" fill="#0F1620" stroke="#1B2733"/>
  <text x="80" y="159" text-anchor="middle" font-family="Consolas, 'JetBrains Mono', monospace" font-size="10" fill="#F5F7FA">SETPOINT</text>

  <rect x="155" y="140" width="70" height="30" rx="4" fill="#0F1620" stroke="#00D2FF"/>
  <text x="190" y="159" text-anchor="middle" font-family="Consolas, 'JetBrains Mono', monospace" font-size="10" fill="#00D2FF">PID</text>

  <rect x="275" y="140" width="90" height="30" rx="4" fill="#0F1620" stroke="#1B2733"/>
  <text x="320" y="159" text-anchor="middle" font-family="Consolas, 'JetBrains Mono', monospace" font-size="10" fill="#F5F7FA">PLANT</text>

  <circle r="3.4" fill="#00D2FF">
    <animateMotion path="M35,155 L365,155" dur="3.5s" repeatCount="indefinite"/>
  </circle>
  <circle r="3" fill="#2563EB" opacity="0.8">
    <animateMotion path="M320,170 L320,205 L80,205 L80,170" dur="4.5s" repeatCount="indefinite"/>
  </circle>

  <g font-family="Consolas, 'JetBrains Mono', monospace" font-size="10">
    <rect x="35" y="245" width="30" height="20" rx="10" fill="none" stroke="#1B2733"/>
    <text x="50" y="258" text-anchor="middle" fill="#8B949E">C</text>

    <rect x="73" y="245" width="66" height="20" rx="10" fill="none" stroke="#1B2733"/>
    <text x="106" y="258" text-anchor="middle" fill="#8B949E">MATLAB</text>

    <rect x="147" y="245" width="130" height="20" rx="10" fill="none" stroke="#1B2733"/>
    <text x="212" y="258" text-anchor="middle" fill="#8B949E">LabWindows/CVI</text>
  </g>
</svg>
