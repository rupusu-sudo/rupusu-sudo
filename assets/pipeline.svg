<svg width="900" height="160" viewBox="0 0 900 160" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="tr" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>

  <line x1="60" y1="90" x2="840" y2="90" stroke="#1B2733" stroke-width="1.2"/>
  <line x1="60" y1="90" x2="840" y2="90" stroke="#00D2FF" stroke-width="1.2" stroke-dasharray="4 9" opacity="0.35">
    <animate attributeName="stroke-dashoffset" from="0" to="-26" dur="1.3s" repeatCount="indefinite"/>
  </line>

  <g font-family="Consolas, 'JetBrains Mono', monospace" font-size="12" letter-spacing="1" fill="#8B949E" text-anchor="middle">
    <text x="60" y="60">INPUT</text>
    <text x="216" y="60">SENSE</text>
    <text x="372" y="60">PROCESS</text>
    <text x="528" y="60">CONTROL</text>
    <text x="684" y="60">ACTUATE</text>
    <text x="840" y="60">OUTPUT</text>
  </g>

  <g fill="#0B1118" stroke="#1B2733" stroke-width="1.2">
    <circle cx="60" cy="90" r="6"/>
    <circle cx="216" cy="90" r="6"/>
    <circle cx="372" cy="90" r="6"/>
    <circle cx="528" cy="90" r="6"/>
    <circle cx="684" cy="90" r="6"/>
    <circle cx="840" cy="90" r="6"/>
  </g>

  <g font-family="Consolas, 'JetBrains Mono', monospace" font-size="11" fill="#8B949E" text-anchor="middle">
    <text x="60" y="120">Software</text>
    <text x="216" y="120">Sensors</text>
    <text x="372" y="120">Logic</text>
    <text x="528" y="120">PID</text>
    <text x="684" y="120">Motion</text>
    <text x="840" y="120">Result</text>
  </g>

  <circle r="10" fill="#00D2FF" opacity="0.3" filter="url(#tr)">
    <animateMotion path="M60,90 L840,90" dur="6s" repeatCount="indefinite"/>
  </circle>
  <circle r="4" fill="#00D2FF">
    <animateMotion path="M60,90 L840,90" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;1;0.2;1" keyTimes="0;0.85;0.9;1" dur="6s" repeatCount="indefinite"/>
  </circle>
</svg>
