<svg width="700" height="230" viewBox="0 0 700 230" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="barGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#00D2FF"/>
    </linearGradient>
  </defs>

  <rect x="20" y="20" width="660" height="190" rx="6" fill="#0B1118" stroke="#1B2733" stroke-width="1.2"/>

  <text x="40" y="50" font-family="Consolas, 'JetBrains Mono', monospace" font-size="13" fill="#8B949E">INITIALIZING ENGINEER PROFILE...</text>

  <!-- progress bar -->
  <rect x="40" y="65" width="520" height="10" rx="2" fill="#0F1620" stroke="#1B2733"/>
  <rect x="40" y="65" height="10" rx="2" fill="url(#barGrad)">
    <animate attributeName="width" values="0;520;520;0" keyTimes="0;0.5;0.95;1" dur="8s" repeatCount="indefinite"/>
  </rect>

  <!-- checklist -->
  <g font-family="Consolas, 'JetBrains Mono', monospace" font-size="13">
    <text x="40" y="105" fill="#1B2733">○</text>
    <text x="58" y="105" fill="#F5F7FA">CONTROL SYSTEMS</text>
    <text x="40" y="105" fill="#00D2FF">
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.0625;0.95;1" dur="8s" repeatCount="indefinite"/>✓</text>

    <text x="40" y="128" fill="#1B2733">○</text>
    <text x="58" y="128" fill="#F5F7FA">ROBOTICS MODULE</text>
    <text x="40" y="128" fill="#00D2FF">
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1625;0.95;1" dur="8s" repeatCount="indefinite"/>✓</text>

    <text x="40" y="151" fill="#1B2733">○</text>
    <text x="58" y="151" fill="#F5F7FA">SOFTWARE ENGINEERING</text>
    <text x="40" y="151" fill="#00D2FF">
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.2625;0.95;1" dur="8s" repeatCount="indefinite"/>✓</text>

    <text x="40" y="174" fill="#1B2733">○</text>
    <text x="58" y="174" fill="#F5F7FA">DIGITALIZATION</text>
    <text x="40" y="174" fill="#00D2FF">
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.3625;0.95;1" dur="8s" repeatCount="indefinite"/>✓</text>

    <text x="40" y="197" fill="#1B2733">○</text>
    <text x="58" y="197" fill="#F5F7FA">SYSTEMS THINKING</text>
    <text x="40" y="197" fill="#00D2FF">
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.4625;0.95;1" dur="8s" repeatCount="indefinite"/>✓</text>
  </g>

  <!-- system online line -->
  <text x="450" y="197" font-family="Consolas, 'JetBrains Mono', monospace" font-size="14" font-weight="700" fill="#00D2FF" letter-spacing="2">
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.5;0.55;0.95;1" dur="8s" repeatCount="indefinite"/>
    SYSTEM ONLINE</text>
  <rect x="612" y="187" width="8" height="14" fill="#00D2FF">
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
  </rect>
</svg>
