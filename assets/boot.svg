<svg width="640" height="260" viewBox="0 0 640 260" xmlns="http://www.w3.org/2000/svg">
  <rect x="20" y="20" width="600" height="220" rx="8" fill="#0B1118" stroke="#1B2733" stroke-width="1.2"/>
  <rect x="20" y="20" width="600" height="3" fill="#00D2FF">
    <animate attributeName="opacity" values="0.2;0.6;0.2" dur="3s" repeatCount="indefinite"/>
  </rect>

  <circle cx="40" cy="36" r="4" fill="#1B2733"/>
  <circle cx="54" cy="36" r="4" fill="#1B2733"/>
  <circle cx="68" cy="36" r="4" fill="#1B2733"/>
  <text x="580" y="40" text-anchor="end" font-family="Consolas, 'JetBrains Mono', monospace" font-size="10" letter-spacing="2" fill="#8B949E">~/engineer --watch</text>
  <line x1="40" y1="50" x2="600" y2="50" stroke="#1B2733"/>

  <defs>
    <clipPath id="cl1"><rect x="38" y="66" width="0" height="18"><animate attributeName="width" values="0;82;82" keyTimes="0.0000;0.1000;1" dur="9s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="cl2"><rect x="38" y="88" width="0" height="18"><animate attributeName="width" values="0;293;293" keyTimes="0.1667;0.2667;1" dur="9s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="cl3"><rect x="38" y="110" width="0" height="18"><animate attributeName="width" values="0;262;262" keyTimes="0.3333;0.4333;1" dur="9s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="cl4"><rect x="38" y="132" width="0" height="18"><animate attributeName="width" values="0;176;176" keyTimes="0.5000;0.6000;1" dur="9s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="cl5"><rect x="38" y="154" width="0" height="18"><animate attributeName="width" values="0;121;121" keyTimes="0.6667;0.7667;1" dur="9s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="cl6"><rect x="38" y="176" width="0" height="18"><animate attributeName="width" values="0;223;223" keyTimes="0.8333;0.9333;1" dur="9s" repeatCount="indefinite"/></rect></clipPath>
  </defs>

  <g font-family="Consolas, 'JetBrains Mono', monospace" font-size="13">
    <text x="40" y="80" fill="#00D2FF" clip-path="url(#cl1)">$ whoami</text>
    <text x="40" y="102" fill="#8B949E" clip-path="url(#cl2)">&gt; rupusu-sudo — automation engineer</text>
    <text x="40" y="124" fill="#00D2FF" clip-path="url(#cl3)">$ systemctl status control-loop</text>
    <text x="40" y="146" fill="#8B949E" clip-path="url(#cl4)">&gt; ● active (running)</text>
    <text x="40" y="168" fill="#00D2FF" clip-path="url(#cl5)">$ echo $MOTTO</text>
    <text x="40" y="190" fill="#8B949E" clip-path="url(#cl6)">&gt; Code. Optimize. Repeat.</text>
  </g>

  <rect width="8" height="15" fill="#00D2FF">
    <animate attributeName="x" values="122;340;310;216;161;263" keyTimes="0;0.1667;0.3333;0.5000;0.6667;0.8333" calcMode="discrete" dur="9s" repeatCount="indefinite"/>
    <animate attributeName="y" values="68;90;112;134;156;178" keyTimes="0;0.1667;0.3333;0.5000;0.6667;0.8333" calcMode="discrete" dur="9s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
  </rect>
</svg>
