    <animate attributeName="opacity" values="0.12;0.35;0.12" dur="3.4s" repeatCount="indefinite"/>
  </circle>

  <text x="40" y="55" font-family="Consolas, 'JetBrains Mono', monospace" font-size="19" font-weight="700" fill="#F5F7FA">ALMAJ DIGITAL PORTAL</text>
  <text x="40" y="75" font-family="Consolas, 'JetBrains Mono', monospace" font-size="11" fill="#8B949E">Primaria Almaj, Dolj County  ·  React · Node.js · MySQL · Prisma · OCR</text>

