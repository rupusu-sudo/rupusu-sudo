  </circle>
  <text x="712" y="46" font-family="Consolas, 'JetBrains Mono', monospace" font-size="11" letter-spacing="2" fill="#00D2FF">ACTIVE DEVELOPMENT</text>

  <text x="430" y="108" text-anchor="middle" font-family="Consolas, 'JetBrains Mono', monospace" font-size="12" fill="#F5F7FA">CITIZEN</text>
