    <path d="M430,166 L430,190 L290,190 L290,225"/>
    <path d="M430,166 L430,190 L430,225"/>
    <path d="M430,166 L430,190 L570,190 L570,225"/>
    <path d="M430,166 L430,190 L730,190 L730,225"/>
  </g>

  <g fill="#0B1118" stroke="#1B2733" stroke-width="1.2">
