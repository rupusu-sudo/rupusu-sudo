<svg width="640" height="260" viewBox="0 0 640 260" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="cardClip">
      <rect x="20" y="20" width="600" height="220" rx="8"/>
    </clipPath>
    <linearGradient id="scanGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00D2FF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00D2FF" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#00D2FF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect x="20" y="20" width="600" height="220" rx="8" fill="#0B1118"/>
  <rect x="20" y="20" width="600" height="220" rx="8" fill="none" stroke="#1B2733" stroke-width="1.2"/>
  <rect x="20" y="20" width="600" height="220" rx="8" fill="none" stroke="#00D2FF" stroke-width="1.2">
    <animate attributeName="opacity" values="0.15;0.5;0.15" dur="3.5s" repeatCount="indefinite"/>
  </rect>

  <g clip-path="url(#cardClip)">
    <rect x="20" width="600" height="40" fill="url(#scanGrad)">
      <animate attributeName="y" values="20;220;20" dur="5s" repeatCount="indefinite"/>
    </rect>
  </g>

  <text x="46" y="55" font-family="Consolas, 'JetBrains Mono', monospace" font-size="13" letter-spacing="3" fill="#8B949E">ENGINEER PROFILE</text>
  <line x1="46" y1="66" x2="594" y2="66" stroke="#1B2733"/>

  <g font-family="Consolas, 'JetBrains Mono', monospace" font-size="14">
    <text x="46" y="98" fill="#8B949E">NAME</text>
    <text x="200" y="98" fill="#F5F7FA">Ionut-Marian Falcoi</text>

    <text x="46" y="126" fill="#8B949E">HANDLE</text>
    <text x="200" y="126" fill="#F5F7FA">rupusu-sudo / ruppz</text>

    <text x="46" y="154" fill="#8B949E">FIELD</text>
    <text x="200" y="154" fill="#F5F7FA">Automation Engineering</text>

    <text x="46" y="182" fill="#8B949E">UNIVERSITY</text>
    <text x="200" y="182" fill="#F5F7FA">UCv · Craiova, Romania</text>
  </g>

  <line x1="46" y1="196" x2="594" y2="196" stroke="#1B2733"/>

  <circle cx="52" cy="220" r="4" fill="#00D2FF">
    <animate attributeName="opacity" values="1;0.25;1" dur="1.6s" repeatCount="indefinite"/>
  </circle>
  <text x="64" y="224" font-family="Consolas, 'JetBrains Mono', monospace" font-size="13" letter-spacing="2" fill="#00D2FF">BUILDING</text>
</svg>
