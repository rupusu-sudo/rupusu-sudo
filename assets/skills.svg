<svg width="640" height="460" viewBox="0 0 640 460" xmlns="http://www.w3.org/2000/svg">
  <g stroke="#1B2733" stroke-width="1.2">
    <line x1="320" y1="230" x2="320" y2="110"/>
    <line x1="320" y1="230" x2="440" y2="230"/>
    <line x1="320" y1="230" x2="320" y2="350"/>
    <line x1="320" y1="230" x2="200" y2="230"/>
  </g>

  <circle cx="320" cy="230" r="34" fill="#0B1118" stroke="#00D2FF" stroke-width="1.2"/>
  <text x="320" y="226" text-anchor="middle" font-family="Consolas, 'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#00D2FF">rupusu</text>
  <text x="320" y="240" text-anchor="middle" font-family="Consolas, 'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#00D2FF">-sudo</text>

  <!-- CONTROL (top) -->
  <circle cx="320" cy="110" r="6" fill="#00D2FF">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="3s" begin="0s" repeatCount="indefinite"/>
  </circle>
  <text x="320" y="85" text-anchor="middle" font-family="Consolas, 'JetBrains Mono', monospace" font-size="13" letter-spacing="2" fill="#F5F7FA">CONTROL</text>
  <text x="320" y="65" text-anchor="middle" font-family="Consolas, 'JetBrains Mono', monospace" font-size="11" fill="#8B949E">C · C++ · MATLAB</text>

  <!-- SOFTWARE (right) -->
  <circle cx="440" cy="230" r="6" fill="#00D2FF">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="3s" begin="0.75s" repeatCount="indefinite"/>
  </circle>
  <text x="460" y="226" text-anchor="start" font-family="Consolas, 'JetBrains Mono', monospace" font-size="13" letter-spacing="2" fill="#F5F7FA">SOFTWARE</text>
  <text x="460" y="246" text-anchor="start" font-family="Consolas, 'JetBrains Mono', monospace" font-size="11" fill="#8B949E">React · TS · Node.js</text>

  <!-- ROBOTICS (bottom) -->
  <circle cx="320" cy="350" r="6" fill="#2563EB">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="3s" begin="1.5s" repeatCount="indefinite"/>
  </circle>
  <text x="320" y="378" text-anchor="middle" font-family="Consolas, 'JetBrains Mono', monospace" font-size="13" letter-spacing="2" fill="#F5F7FA">ROBOTICS</text>
  <text x="320" y="398" text-anchor="middle" font-family="Consolas, 'JetBrains Mono', monospace" font-size="11" fill="#8B949E">PID · Sensors · Kinematics</text>

  <!-- DIGITALIZATION (left) -->
  <circle cx="200" cy="230" r="6" fill="#00D2FF">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="3s" begin="2.25s" repeatCount="indefinite"/>
  </circle>
  <text x="180" y="226" text-anchor="end" font-family="Consolas, 'JetBrains Mono', monospace" font-size="13" letter-spacing="2" fill="#F5F7FA">DIGITALIZATION</text>
  <text x="180" y="246" text-anchor="end" font-family="Consolas, 'JetBrains Mono', monospace" font-size="11" fill="#8B949E">Python · SQL · .NET</text>
</svg>
