<svg width="700" height="390" viewBox="0 0 700 390" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="tr" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>

  <!-- trunk lines -->
  <g stroke="#1B2733" stroke-width="1.2" fill="none">
    <line x1="350" y1="52" x2="350" y2="90"/>
    <line x1="350" y1="130" x2="350" y2="170"/>
    <line x1="350" y1="210" x2="350" y2="250"/>
    <line x1="350" y1="290" x2="220" y2="330"/>
    <line x1="350" y1="290" x2="480" y2="330"/>
  </g>

  <!-- camera -->
  <circle cx="350" cy="40" r="11" fill="#0B1118" stroke="#1B2733" stroke-width="1.2"/>
  <circle cx="350" cy="40" r="4" fill="#00D2FF">
    <animate attributeName="opacity" values="1;0.2;1" dur="1.4s" repeatCount="indefinite"/>
  </circle>
  <text x="350" y="18" text-anchor="middle" font-family="Consolas, 'JetBrains Mono', monospace" font-size="11" letter-spacing="2" fill="#8B949E">CAMERA</text>

  <!-- vision box -->
  <rect x="290" y="90" width="120" height="40" rx="4" fill="#0B1118" stroke="#1B2733" stroke-width="1.2"/>
  <text x="350" y="114" text-anchor="middle" font-family="Consolas, 'JetBrains Mono', monospace" font-size="12" fill="#F5F7FA">VISION</text>

  <!-- plc box -->
  <rect x="290" y="170" width="120" height="40" rx="4" fill="#0B1118" stroke="#1B2733" stroke-width="1.2"/>
  <text x="350" y="194" text-anchor="middle" font-family="Consolas, 'JetBrains Mono', monospace" font-size="12" fill="#F5F7FA">PLC / LOGIC</text>

  <!-- robot -->
  <circle cx="350" cy="270" r="20" fill="#0B1118" stroke="#00D2FF" stroke-width="1.2"/>
  <text x="350" y="274" text-anchor="middle" font-family="Consolas, 'JetBrains Mono', monospace" font-size="10" fill="#00D2FF">ROBOT</text>

  <!-- bins -->
  <rect x="170" y="330" width="100" height="34" rx="4" fill="#0B1118" stroke="#1B2733" stroke-width="1.2"/>
  <text x="220" y="352" text-anchor="middle" font-family="Consolas, 'JetBrains Mono', monospace" font-size="11" fill="#8B949E">BIN A</text>

  <rect x="430" y="330" width="100" height="34" rx="4" fill="#0B1118" stroke="#1B2733" stroke-width="1.2"/>
  <text x="480" y="352" text-anchor="middle" font-family="Consolas, 'JetBrains Mono', monospace" font-size="11" fill="#8B949E">BIN B</text>

  <!-- travelling packets -->
  <circle r="8" fill="#00D2FF" opacity="0.3" filter="url(#tr)">
    <animateMotion dur="6s" repeatCount="indefinite"
      path="M350,50 L350,90 L350,130 L350,170 L350,210 L350,250 L350,290 L220,330"/>
  </circle>
  <rect width="6" height="6" fill="#00D2FF">
    <animateMotion dur="6s" repeatCount="indefinite"
      path="M350,50 L350,90 L350,130 L350,170 L350,210 L350,250 L350,290 L220,330"/>
  </rect>

  <circle r="8" fill="#2563EB" opacity="0.3" filter="url(#tr)">
    <animateMotion dur="6s" begin="3s" repeatCount="indefinite"
      path="M350,50 L350,90 L350,130 L350,170 L350,210 L350,250 L350,290 L480,330"/>
  </circle>
  <rect width="6" height="6" fill="#2563EB">
    <animateMotion dur="6s" begin="3s" repeatCount="indefinite"
      path="M350,50 L350,90 L350,130 L350,170 L350,210 L350,250 L350,290 L480,330"/>
  </rect>

  <text x="350" y="382" text-anchor="middle" font-family="Consolas, 'JetBrains Mono', monospace" font-size="11" font-style="italic" fill="#8B949E">Conceptual pipeline studied through coursework — not a deployed industrial system.</text>
</svg>
